<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video rePrompt — 视频反推镜头提示词</title>
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-row">
        <div class="header-left">
          <h1>Video rePrompt</h1>
          <p class="subtitle">上传视频或粘贴链接，自动识别每个镜头并生成画面描述提示词</p>
          <p class="version-line" id="versionLine"></p>
        </div>
        <div class="header-toolbar" id="headerToolbar"></div>
      </div>
    </header>

    <!-- Upload Section -->
    <section id="uploadSection" class="upload-section">
      <div class="input-tabs">
        <button id="tabFile" class="input-tab active">上传文件</button>
        <button id="tabUrl" class="input-tab">粘贴链接</button>
      </div>

      <div id="filePanel" class="input-panel">
        <div id="dropZone" class="drop-zone">
          <div class="drop-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-text">拖拽视频文件到此处</p>
          <p class="drop-or">或</p>
          <label class="browse-btn" id="browseBtn">
            选择文件
            <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv,.webm" hidden>
          </label>
          <p class="drop-hint">支持 MP4, MOV, AVI, MKV, WebM，最大 2GB</p>
        </div>
      </div>

      <div id="urlPanel" class="input-panel hidden">
        <div class="url-zone">
          <div class="url-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          </div>
          <p class="url-label">粘贴视频链接</p>
          <div class="url-input-row">
            <input type="text" id="urlInput" class="url-input" placeholder="https://example.com/video.mp4">
            <button id="urlSubmitBtn" class="browse-btn">开始分析</button>
          </div>
          <p class="drop-hint">支持直链视频 URL（mp4、mov 等），自动下载后分析</p>
        </div>
      </div>

      <div id="uploadError" class="error-msg hidden"></div>

      <div id="recentAnalyses" class="recent-analyses hidden">
        <div class="recent-header">
          <h3 class="recent-title">最近分析</h3>
          <div class="recent-actions" id="recentActions">
            <div class="recent-per-page">
              <label>排序</label>
              <select id="recentSortMode">
                <option value="mtime" selected>修改时间</option>
                <option value="added">添加时间</option>
              </select>
              <label>每页</label>
              <select id="recentPerPage">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>
            <button id="recentManageBtn" class="tb-btn">管理</button>
            <div id="recentManageBar" class="recent-manage-bar hidden">
              <label class="recent-select-all-label"><input type="checkbox" id="recentSelectAll"> 全选</label>
              <span id="recentSelectedHint" class="recent-selected-hint"></span>
              <button id="recentDeleteBtn" class="tb-btn" style="border-color:var(--error);color:var(--error)">删除选中缓存</button>
              <button id="recentManageDoneBtn" class="tb-btn primary">完成</button>
            </div>
          </div>
        </div>
        <div id="recentList" class="recent-list"></div>
        <div id="recentPagination" class="recent-pagination hidden"></div>
      </div>

      <!-- Settings -->
      <div class="settings-row">
        <div class="settings-row-top">
          <span class="settings-label">附加提示词：</span>
          <div class="settings-top-right">
            <label class="min-shot-label">最短镜头<span class="min-shot-unit">秒</span><input type="number" id="minShotDuration" class="min-shot-input" value="1.0" min="0.1" max="10" step="0.1"></label>
            <button id="clearCacheBtn" class="btn-clear-top">清除所有缓存</button>
          </div>
        </div>
        <div class="custom-prompt-row">
          <textarea id="customPromptInput" class="custom-prompt-input" placeholder="可选，追加到分析和转写指令中，例如：忽略水印、不要描述文字…" rows="3"></textarea>
          <button id="customPromptSubmit" class="custom-prompt-submit">添加</button>
        </div>
        <div id="promptHistory" class="prompt-history hidden"></div>
        <div class="config-panel">
          <button id="configToggle" class="config-toggle">⚙ 接口配置</button>
          <span id="configStatus" class="config-status"></span>
          <div id="configBody" class="config-body">
            <div class="config-grid">
              <div class="config-group">
                <h4 class="config-group-title">视觉模型</h4>
                <label>Provider
                  <select id="cfgVisionProvider">
                    <option value="dashscope">阿里云 DashScope</option>
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic Claude</option>
                    <option value="google">Google Gemini</option>
                    <option value="__custom__">自定义</option>
                  </select>
                  <input id="cfgVisionProviderCustom" class="config-custom-input hidden" placeholder="输入 Provider 名称">
                </label>
                <label>Base URL<input id="cfgVisionBaseUrl" placeholder="https://api.openai.com/v1"></label>
                <label>API Key<input id="cfgVisionApiKey" type="password" placeholder="sk-xxx"></label>
                <label>Model<input id="cfgVisionModel" placeholder="gpt-4o"></label>
                <label>并发数<input id="cfgVisionConcurrency" class="config-token-input" value="5" placeholder="5"></label>
                <label>最大 Token<input id="cfgVisionMaxTokens" class="config-token-input" value="1024" placeholder="1024"></label>
                <div class="config-test-row">
                  <button id="cfgVisionTest" class="config-test-btn">测试连接</button>
                  <span id="cfgVisionTestResult" class="config-test-result hidden"></span>
                
                  
                
                  <button id="cfgVisionSave" class="config-save-btn">保存视觉配置</button>
                </div>
                <div id="cfgVisionPresets" class="config-presets hidden"></div>
              
                
              </div>
              <div class="config-group">
                <h4 class="config-group-title">音频/台词模型</h4>
                <label>Provider
                  <select id="cfgAudioProvider">
                    <option value="dashscope">阿里云 DashScope</option>
                    <option value="openai">OpenAI</option>
                    <option value="__custom__">自定义</option>
                    <option value="none">关闭</option>
                  </select>
                  <input id="cfgAudioProviderCustom" class="config-custom-input hidden" placeholder="输入 Provider 名称">
                </label>
                <label>Base URL<input id="cfgAudioBaseUrl" placeholder="https://api.openai.com/v1"></label>
                <label>API Key<input id="cfgAudioApiKey" type="password" placeholder="sk-xxx"></label>
                <label>Model<input id="cfgAudioModel" placeholder="whisper-1"></label>
                <label>并发数<input id="cfgAudioConcurrency" class="config-token-input" value="3" placeholder="3"></label>
                <div class="config-test-row">
                  <button id="cfgAudioTest" class="config-test-btn">测试连接</button>
                  <span id="cfgAudioTestResult" class="config-test-result hidden"></span>
                
                  
                
                  <button id="cfgAudioSave" class="config-save-btn">保存音频配置</button>
                </div>
                <div id="cfgAudioPresets" class="config-presets hidden"></div>
              
                
              </div>
            </div>
        </div>
      </div>
    </section>

    <!-- Progress Section -->
    <section id="progressSection" class="progress-section hidden">
      <div class="progress-card">
        <div class="progress-bar-track">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <p id="progressLabel" class="progress-label">准备中...</p>
        <p id="progressDetail" class="progress-detail"></p>
        <div id="progressLog" class="progress-log"></div>
      </div>
    </section>

    <!-- Range Selection Section -->
    <section id="rangeSection" class="range-section hidden">
      <div class="range-card">
        <h3>检测到 <span id="rangeCount">0</span> 个镜头</h3>
        <p class="range-subtitle">拖拽滑块选择要分析的镜头范围</p>
        <div class="range-slider-wrap">
          <input type="range" id="rangeStart" class="range-input" min="1" value="1">
          <input type="range" id="rangeEnd" class="range-input" min="1" value="1">
          <div class="range-track"></div>
          <div class="range-fill" id="rangeFill"></div>
        </div>
        <div class="range-labels">
          <span id="rangeLabelStart">镜头 1</span>
          <span id="rangeLabelEnd">镜头 1</span>
        </div>
        <div class="range-input-row">
          <label class="range-input-label">从</label>
          <input type="number" id="rangeStartNum" class="range-num" min="1" value="1">
          <label class="range-input-label">到</label>
          <input type="number" id="rangeEndNum" class="range-num" min="1" value="10">
          <span class="range-input-unit">（共 <span id="rangeSelectedCount">10</span> 个）</span>
        </div>
        <button id="rangeConfirmBtn" class="browse-btn">开始分析选中范围</button>
        <div class="filmstrip-wrap">
          <div id="filmstrip" class="filmstrip"></div>
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <div class="results-summary">
          <h2 id="resultsTitle">分析结果</h2>
          <p id="resultsMeta"></p>
        </div>
        <div class="results-actions">
          <button id="copyAllBtn" class="btn-copy">复制全部描述</button>
          <button id="exportBtn" class="btn-export">导出为文件</button>
        </div>
      </div>
      <div id="shotsTimeline" class="shots-timeline"></div>
      <div class="results-footer">
        <button id="copyAllBtn2" class="btn-copy">复制全部描述</button>
        <button id="exportBtn2" class="btn-export">导出为文件</button>
      </div>
    </section>

    <!-- Error Section -->
    <section id="errorSection" class="error-section hidden">
      <div class="error-card">
        <h3>处理失败</h3>
        <p id="errorMessage"></p>
        <button id="retryBtn" class="browse-btn">重新上传</button>
      </div>
    </section>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightboxClose" class="lightbox-close">&times;</button>
      <img id="lightboxImg" src="" alt="Full frame">
    </div>
  </div>

  <script src="/js/app.js?v=9"></script>
</body>
</html>
